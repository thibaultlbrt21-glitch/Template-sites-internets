name: Deploy sites to GitHub Pages

# Publishes multiple independent static sites from this repo under one
# GitHub Pages deployment, each at its own path, so adding a new site
# never breaks the URL of an existing one:
#   /                                   -> le-ptit-bouchon-dijonnais/ (unchanged)
#   /webly-template-restaurant/         -> webly-template-restaurant/
#   /webly-template-restaurant-mini/    -> webly-template-restaurant-mini/
#   /webly-template-restaurant-premium/ -> webly-template-restaurant-premium/
#
# To add another site later: add one more `cp -r` line in "Assemble
# combined site" below, and its own path filter under `paths:`.

on:
  push:
    branches:
      - main
      - claude/everything-claude-code-t5ohfd
    paths:
      - "le-ptit-bouchon-dijonnais/**"
      - "webly-template-restaurant/**"
      - "webly-template-restaurant-mini/**"
      - "webly-template-restaurant-premium/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble combined site
        run: |
          set -e
          mkdir -p _site
          cp -r le-ptit-bouchon-dijonnais/. _site/
          mkdir -p _site/webly-template-restaurant
          cp -r webly-template-restaurant/. _site/webly-template-restaurant/
          mkdir -p _site/webly-template-restaurant-mini
          cp -r webly-template-restaurant-mini/. _site/webly-template-restaurant-mini/
          mkdir -p _site/webly-template-restaurant-premium
          cp -r webly-template-restaurant-premium/. _site/webly-template-restaurant-premium/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

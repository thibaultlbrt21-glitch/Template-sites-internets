# =============================================================================
# TDS Fermetures — Espace client (Decap CMS)
# -----------------------------------------------------------------------------
# Décrit les champs que TDS Fermetures peut modifier depuis /admin/.
# Chaque enregistrement écrit un commit dans content/site.json et le site se
# redéploie tout seul.
#
# À ADAPTER POUR CHAQUE CLIENT (3 lignes) :
#   1. backend.repo     -> le dépôt GitHub du client
#   2. backend.branch   -> la branche publiée par GitHub Pages
#   3. backend.base_url -> l'URL du service d'authentification (voir ADMIN.md)
# =============================================================================

backend:
  name: github
  repo: thibaultlbrt21-glitch/Template-sites-internets
  branch: main

  # Décommentez et remplacez par l'URL de votre service OAuth
  # (Netlify, Cloudflare Worker, Vercel...). Sans cette ligne, la connexion
  # GitHub ne peut pas aboutir. Voir ADMIN.md.
  # base_url: https://votre-service-oauth.exemple.fr

  commit_messages:
    update: "Site : mise à jour de {{collection}} depuis l'espace client"
    uploadMedia: "Site : ajout de l'image {{path}}"
    deleteMedia: "Site : suppression de l'image {{path}}"

# Permet d'essayer l'interface en local avec `npx decap-server`.
local_backend: true

# Chemins relatifs à la RACINE du dépôt.
media_folder: "tds-fermetures/assets/images"
# Chemin écrit dans le JSON, relatif à la page d'accueil du site.
public_folder: "assets/images"

locale: fr

editor:
  preview: false

collections:
  - name: "contenu"
    label: "Contenu du site"
    editor:
      preview: false
    files:
      - name: "accueil"
        label: "Page d'accueil"
        file: "tds-fermetures/content/site.json"
        description: >-
          Tout ce qui s'affiche sur le site. Laissez un champ vide pour garder
          le texte déjà en place ; videz une liste entière (réalisations,
          avis) pour masquer la section correspondante.
        fields:

          - label: "Nom et signature"
            name: "marque"
            widget: "object"
            fields:
              - { label: "Nom de l'entreprise", name: "nom", widget: "string" }
              - label: "Signature"
                name: "baseline"
                widget: "string"
                hint: "Quelques mots, par exemple : Portes · fenêtres · volets · portails."

          - label: "Bandeau d'accueil"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Petite mention au-dessus du titre", name: "surtitre", widget: "string" }
              - { label: "Titre — première ligne", name: "titre_1", widget: "string", hint: "S'affiche en blanc, en gras." }
              - { label: "Titre — seconde ligne", name: "titre_2", widget: "string", hint: "S'affiche en orange, plus fin." }
              - { label: "Texte d'introduction", name: "texte", widget: "text" }
              - label: "Photos (à droite du titre)"
                name: "photos"
                widget: "list"
                label_singular: "Photo"
                summary: "{{fields.legende}}"
                hint: >-
                  Elles défilent en fondu, dans cet ordre ; la première s'affiche dès
                  l'ouverture du site. Format en hauteur conseillé (4:5), au moins
                  800 px de large. Deux à quatre photos suffisent.
                fields:
                  - { label: "Photo", name: "image", widget: "image" }
                  - label: "Description pour les lecteurs d'écran"
                    name: "alt"
                    widget: "string"
                    required: false
                    hint: "Ce que montre la photo, en quelques mots."
                  - { label: "Légende", name: "legende", widget: "string", required: false, hint: "Affichée sous les boutons, par exemple : Baie coulissante." }
                  - label: "Crédit photo"
                    name: "credit"
                    widget: "string"
                    required: false
                    hint: "Obligatoire pour une photo de fabricant (ex. Photo FenêtréA). Laissez vide pour vos propres photos."

          - label: "Encadré (coin de l'accueil)"
            name: "cartouche"
            widget: "object"
            collapsed: true
            hint: "Lignes courtes. N'y mettez que des informations exactes. Le téléphone se règle dans « Contact »."
            fields:
              - { label: "Dirigeant", name: "dirigeant", widget: "string" }
              - { label: "Métier", name: "metier", widget: "string" }
              - { label: "Après la pose", name: "sav", widget: "string" }

          - label: "Engagements (bandeau orange)"
            name: "engagements"
            widget: "list"
            label_singular: "Engagement"
            summary: "{{fields.titre}}"
            hint: "Les quatre mots de la carte de visite. Videz la liste pour masquer le bandeau."
            fields:
              - { label: "Intitulé", name: "titre", widget: "string" }
              - { label: "Précision", name: "texte", widget: "text", required: false }

          - label: "Photos principales"
            name: "images"
            widget: "object"
            collapsed: true
            hint: "Les photos de l'accueil se règlent dans « Bandeau d'accueil »."
            fields:
              - label: "L'entreprise"
                name: "entreprise"
                widget: "image"
                required: false
                hint: "Par défaut, le logo. Une photo de Tiago sur un chantier fonctionne très bien ici."

          - label: "Prestations"
            name: "prestations"
            widget: "object"
            fields:
              - { label: "Titre de la section", name: "titre", widget: "string" }
              - { label: "Texte sous le titre", name: "texte", widget: "text", required: false }
              - label: "Ce que vous posez"
                name: "liste"
                widget: "list"
                label_singular: "Prestation"
                summary: "{{fields.titre}}"
                hint: >-
                  La numérotation (01, 02...) est automatique. N'annoncez que les
                  prestations que vous réalisez vraiment : un client qui appelle pour
                  autre chose vous fait perdre du temps à tous les deux.
                fields:
                  - { label: "Intitulé", name: "titre", widget: "string" }
                  - { label: "Description", name: "texte", widget: "text", required: false }

          - label: "En images (galerie)"
            name: "chantiers"
            widget: "object"
            fields:
              - { label: "Titre de la section", name: "titre", widget: "string" }
              - { label: "Texte sous le titre", name: "texte", widget: "text", required: false }
              - label: "Photos"
                name: "ouvrages"
                widget: "list"
                label_singular: "Photo"
                summary: "{{fields.titre}} — {{fields.meta}}"
                hint: >-
                  Une photo en largeur occupe automatiquement deux cases. Vos photos de
                  chantier se présentent comme telles ; une photo de fabricant porte
                  toujours son crédit, et n'est jamais présentée comme un chantier.
                  Les avant/après sont ce qui convainc le plus en rénovation.
                fields:
                  - { label: "Titre", name: "titre", widget: "string" }
                  - label: "Sous-titre"
                    name: "meta"
                    widget: "string"
                    required: false
                    hint: "Par exemple : Motorisé · Visiophone"
                  - label: "Catégorie"
                    name: "categorie"
                    widget: "select"
                    options:
                      - { label: "Fenêtres & volets", value: "fermetures" }
                      - { label: "Baies coulissantes", value: "coulissants" }
                      - { label: "Portes & garages", value: "portes" }
                      - { label: "Portails & pergolas", value: "exterieur" }
                    hint: "Sert aux boutons de filtre. Un filtre sans chantier disparaît tout seul."
                  - { label: "Photo", name: "image", widget: "image" }
                  - label: "Description pour les lecteurs d'écran"
                    name: "alt"
                    widget: "string"
                    required: false
                    hint: "Ce que montre la photo, en quelques mots. Sert aux personnes malvoyantes et au référencement."
                  - label: "Crédit photo"
                    name: "credit"
                    widget: "string"
                    required: false
                    hint: "Affiché dans la visionneuse. Obligatoire pour une photo de fabricant (ex. Photo FenêtréA)."
              - { label: "Mention sous la galerie", name: "mention", widget: "text", required: false }

          - label: "TVA réduite et aides"
            name: "aides"
            widget: "object"
            fields:
              - { label: "Titre de la section", name: "titre", widget: "string" }
              - { label: "Texte sous le titre", name: "texte", widget: "text", required: false }
              - label: "Dispositifs"
                name: "dispositifs"
                widget: "list"
                label_singular: "Dispositif"
                summary: "{{fields.sigle}} — {{fields.titre}}"
                hint: >-
                  N'annoncez jamais de montant chiffré : plafonds et barèmes changent
                  chaque année, et une promesse non tenue est une pratique commerciale
                  trompeuse. Décrivez les conditions, renvoyez vers France Rénov'.
                fields:
                  - { label: "Sigle ou nom court", name: "sigle", widget: "string" }
                  - { label: "Intitulé", name: "titre", widget: "string" }
                  - { label: "Conditions", name: "texte", widget: "text", required: false }
              - label: "Votre qualification RGE"
                name: "qualification"
                widget: "text"
                hint: >-
                  Aujourd'hui : pas de RGE. Si vous l'obtenez, indiquez l'organisme, le
                  numéro et la date de validité, et prévenez Thibault pour adapter la
                  section. Afficher une qualification que l'on ne détient pas est un faux.
              - { label: "Mention sous la section", name: "mention", widget: "text", required: false }

          - label: "L'entreprise"
            name: "entreprise"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Premier paragraphe", name: "paragraphe_1", widget: "text" }
              - { label: "Second paragraphe", name: "paragraphe_2", widget: "text" }

          - label: "Déroulé d'un chantier"
            name: "processus"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Titre de la section", name: "titre", widget: "string" }
              - label: "Étapes"
                name: "etapes"
                widget: "list"
                label_singular: "Étape"
                summary: "{{fields.titre}}"
                hint: "La numérotation est automatique."
                fields:
                  - { label: "Intitulé", name: "titre", widget: "string" }
                  - { label: "Description", name: "texte", widget: "text", required: false }

          - label: "Demande de devis"
            name: "devis"
            widget: "object"
            fields:
              - { label: "Titre de la section", name: "titre", widget: "string" }
              - { label: "Texte sous le titre", name: "texte", widget: "text", required: false }
              - label: "Email qui reçoit les demandes"
                name: "email_reception"
                widget: "string"
                pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', "Saisissez une adresse email valide."]
                hint: "C'est l'adresse vers laquelle part chaque demande de devis."
              - { label: "Titre de l'encadré de droite", name: "aparte_titre", widget: "string" }
              - label: "Engagements"
                name: "garanties"
                widget: "list"
                label_singular: "Engagement"
                summary: "{{fields.titre}}"
                hint: "N'annoncez que ce que vous tenez réellement : un délai affiché vous engage."
                fields:
                  - { label: "Intitulé", name: "titre", widget: "string" }
                  - { label: "Précision", name: "texte", widget: "text", required: false }

          - { label: "Titre de la section Avis", name: "avis_titre", widget: "string" }

          - label: "Avis clients"
            name: "avis"
            widget: "list"
            label_singular: "Avis"
            collapsed: true
            summary: "{{fields.auteur}} — {{fields.texte}}"
            hint: >-
              N'ajoutez que des avis réellement reçus, en citant leur source (Google
              Avis, Houzz, courrier client). Publier un avis inventé est une pratique
              commerciale trompeuse, sanctionnée par le code de la consommation. Videz
              la liste pour masquer complètement la section.
            fields:
              - { label: "Note sur 5", name: "note", widget: "number", value_type: "int", min: 1, max: 5, required: false }
              - { label: "Texte de l'avis", name: "texte", widget: "text" }
              - { label: "Auteur", name: "auteur", widget: "string", required: false }
              - { label: "Source", name: "source", widget: "string", required: false }

          - label: "Mention sous les avis"
            name: "avis_note"
            widget: "text"
            required: false
            hint: "Videz ce champ pour faire disparaître la mention du site."

          - label: "Contact"
            name: "infos"
            widget: "object"
            fields:
              - { label: "Titre de la section", name: "titre", widget: "string" }
              - label: "Téléphone"
                name: "telephone"
                widget: "string"
                hint: "Met à jour tous les boutons « Appeler » du site."
              - { label: "Email clients", name: "email", widget: "string" }
              - { label: "Email fournisseurs", name: "email_fournisseurs", widget: "string", required: false }
              - { label: "Adresse — ligne 1", name: "adresse_1", widget: "string" }
              - { label: "Adresse — ligne 2", name: "adresse_2", widget: "string" }
              - label: "Horaires"
                name: "horaires"
                widget: "list"
                label_singular: "Ligne d'horaires"
                summary: "{{fields.jours}} — {{fields.horaire}}"
                required: false
                hint: "Laissez la liste vide pour ne pas afficher d'horaires."
                fields:
                  - { label: "Jours", name: "jours", widget: "string" }
                  - { label: "Horaires", name: "horaire", widget: "string" }
              - label: "Zone d'intervention"
                name: "zones"
                widget: "list"
                label_singular: "Commune"
                field: { label: "Commune", name: "commune", widget: "string" }
                hint: "Une commune par ligne. N'annoncez que les secteurs où vous vous déplacez vraiment."

          - label: "Pied de page"
            name: "pied"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Texte de présentation", name: "texte", widget: "text" }
              - label: "Réseaux sociaux"
                name: "reseaux"
                widget: "list"
                label_singular: "Réseau"
                summary: "{{fields.nom}}"
                fields:
                  - { label: "Nom affiché", name: "nom", widget: "string" }
                  - label: "Adresse du profil"
                    name: "url"
                    widget: "string"
                    required: false
                    hint: "Le lien complet (https://www.facebook.com/...). Sans lien, le nom s'affiche sans être cliquable."

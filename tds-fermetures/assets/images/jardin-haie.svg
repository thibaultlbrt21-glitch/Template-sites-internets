<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1024" width="2048" height="1024">
<defs>
  <filter id="bord" x="-5%" y="-30%" width="110%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05 0.08" numOctaves="4" seed="21" result="b"/>
    <feDisplacementMap in="SourceGraphic" in2="b" scale="26" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="houppier" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="33" result="b"/>
    <feDisplacementMap in="SourceGraphic" in2="b" scale="70" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  
  <filter id="grainHaie" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.11" numOctaves="4" seed="41" result="bruit"/>
    <feColorMatrix in="bruit" type="luminanceToAlpha" result="lum0"/>
    <feComponentTransfer in="lum0" result="lum">
      <feFuncA type="table" tableValues="0 0.05 0.35 0.75 1"/>
    </feComponentTransfer>
    <feFlood flood-color="#c2d98a" result="c"/>
    <feComposite in="c" in2="lum" operator="in" result="lumiere"/>
    <feFlood flood-color="#58773a" result="s"/>
    <feMerge result="melange"><feMergeNode in="s"/><feMergeNode in="lumiere"/></feMerge>
    <feComposite in="melange" in2="SourceAlpha" operator="in" result="net"/>
    <feGaussianBlur in="net" stdDeviation="1.3"/>
  </filter>
  
  <filter id="grainArbre" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="4" seed="57" result="bruit"/>
    <feColorMatrix in="bruit" type="luminanceToAlpha" result="lum0"/>
    <feComponentTransfer in="lum0" result="lum">
      <feFuncA type="table" tableValues="0 0.05 0.35 0.75 1"/>
    </feComponentTransfer>
    <feFlood flood-color="#cbe19b" result="c"/>
    <feComposite in="c" in2="lum" operator="in" result="lumiere"/>
    <feFlood flood-color="#5f8740" result="s"/>
    <feMerge result="melange"><feMergeNode in="s"/><feMergeNode in="lumiere"/></feMerge>
    <feComposite in="melange" in2="SourceAlpha" operator="in" result="net"/>
    <feGaussianBlur in="net" stdDeviation="1.6"/>
  </filter>
  <linearGradient id="ombreHaie" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="0.7" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#1e2a12" stop-opacity="0.35"/>
  </linearGradient>
  <linearGradient id="pelouse" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8fae59"/><stop offset="1" stop-color="#6d8d3d"/>
  </linearGradient>
  <filter id="herbe"><feTurbulence type="fractalNoise" baseFrequency="0.7 0.08" numOctaves="2" seed="8"/>
    <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer></filter>
  <filter id="doux"><feGaussianBlur stdDeviation="1.4"/></filter>
  <radialGradient id="modeleArbre" cx="0.38" cy="0.3" r="0.75">
    <stop offset="0" stop-color="#fffbe6" stop-opacity="0.22"/>
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#16240c" stop-opacity="0.42"/>
  </radialGradient>
  <linearGradient id="dessusHaie" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fbffe8" stop-opacity="0.22"/><stop offset="0.35" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="formeArbre"><ellipse cx="1420" cy="350" rx="300" ry="240"/></clipPath>
</defs>
<g filter="url(#doux)">
  <!-- Arbre, derrière la haie -->
  <path d="M1400 840 C 1404 720, 1394 620, 1406 480 C 1410 440, 1400 400, 1403 350 L 1417 350 C 1422 420, 1430 490, 1428 570 C 1426 670, 1432 750, 1434 840 Z" fill="#5d4d3f"/>
  <path d="M1406 540 C 1372 490, 1332 468, 1300 450 L 1306 443 C 1342 460, 1382 482, 1412 520 Z" fill="#5a4b3d"/>
  <g filter="url(#houppier)">
    <ellipse cx="1420" cy="340" rx="232" ry="200" fill="#ffffff" filter="url(#grainArbre)"/>
    <ellipse cx="1296" cy="430" rx="140" ry="110" fill="#ffffff" filter="url(#grainArbre)"/>
    <ellipse cx="1560" cy="420" rx="140" ry="120" fill="#ffffff" filter="url(#grainArbre)"/>
  </g>
  <rect x="1100" y="100" width="640" height="520" fill="url(#modeleArbre)" clip-path="url(#formeArbre)"/>
  <!-- Haie taillée, avec l'ombre à son pied -->
  <g filter="url(#bord)">
    <rect x="-60" y="566" width="2168" height="290" rx="30" fill="#ffffff" filter="url(#grainHaie)"/>
  </g>
  <rect x="0" y="566" width="2048" height="290" fill="url(#ombreHaie)"/>
  <rect x="0" y="560" width="2048" height="120" fill="url(#dessusHaie)"/>
  <!-- Pelouse au pied de la haie -->
  <rect x="0" y="840" width="2048" height="184" fill="url(#pelouse)"/>
  <rect x="0" y="840" width="2048" height="184" filter="url(#herbe)"/>
</g>
</svg>
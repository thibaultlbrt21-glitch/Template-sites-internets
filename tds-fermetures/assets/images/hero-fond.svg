<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" width="1800" height="1200" role="img" aria-label="Atelier de menuiserie">
<defs>
  <filter id="v" x="-10%" y="-10%" width="120%" height="120%">

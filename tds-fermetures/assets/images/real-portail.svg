<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img" aria-label="Portail coulissant et clôture — illustration">
<!-- Ambiance générée pour la démonstration : n'illustre aucun chantier réel. -->
<defs>
  <filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="412"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer></filter>
  <filter id="flou"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="herbe" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.3" numOctaves="3" seed="419"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.3  0 0 0 0 0.15  0 0 0 0.55 0"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#c9d6df"/><stop offset="100%" stop-color="#e9e4da"/>
  </linearGradient>
  <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8c877c"/><stop offset="100%" stop-color="#3b3a36"/>
  </linearGradient>
  <linearGradient id="rasant" x1="0" y1="0" x2="1" y2="0.7">
    <stop offset="0%" stop-color="#fff3df" stop-opacity="0.26"/>
    <stop offset="40%" stop-color="#fff3df" stop-opacity="0.03"/>
    <stop offset="100%" stop-color="#0d0f10" stop-opacity="0.5"/>
  </linearGradient>
  <linearGradient id="lame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#55575a"/><stop offset="100%" stop-color="#2d2f31"/>
  </linearGradient>
</defs>

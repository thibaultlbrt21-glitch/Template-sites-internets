><rect x="510" y="520" width="320" height="18" fill="url(#lame)" opacity="0.92"/><rect x="510" y="554" width="320" height="18" fill="url(#lame)" opacity="0.92"/><rect x="510" y="588" width="320" height="18" fill="url(#lame)" opacity="0.92"/><rect x="510" y="622" width="320" height="18" fill="url(#lame)" opacity="0.92"/><rect x="510" y="656" width="320" height="18" fill="url(#lame)" opacity="0.92"/><rect x="510" y="690" width="320" height="18" fill="url(#lame)" opacity="0.92"/><rect x="90" y="728" width="400" height="8" fill="#1c1d1f"/><rect x="478" y="560" width="24" height="44" rx="3" fill="#1a1b1d"/><rect x="483" y="566" width="14" height="12" rx="2" fill="#7d8a93"/><circle cx="490" cy="592" r="4" fill="#F39200"/><rect x="66" y="440" width="28" height="6" fill="#F39200" opacity="0.9"/><rect x="100" y="470" width="370" height="250" fill="none" stroke="#F39200" stroke-opacity="0.35" stroke-width="1"/><rect width="900" height="1125" fill="url(#rasant)"/><rect width="900" height="1125" filter="url(#g)" opacity="0.55"/></svg>

  </linearGradient>
  <linearGradient id="rasant" x1="0" y1="0" x2="1" y2="0.7">
    <stop offset="0%" stop-color="#fff3df" stop-opacity="0.26"/>
    <stop offset="40%" stop-color="#fff3df" stop-opacity="0.03"/>
    <stop offset="100%" stop-color="#0d0f10" stop-opacity="0.5"/>
  </linearGradient>
  <linearGradient id="lame" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#55575a"/><stop offset="100%" stop-color="#2d2f31"/>
  </linearGradient>
</defs>

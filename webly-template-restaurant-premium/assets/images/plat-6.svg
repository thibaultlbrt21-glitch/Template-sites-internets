<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <radialGradient id="bg" cx="34%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#452d12"/>
      <stop offset="62%" stop-color="#1c1510"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="78%">
      <stop offset="52%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="66"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.11"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <g filter="url(#soft)">
      <circle cx="767" cy="719" r="186" fill="#c2582c" opacity="0.38"/>
      <circle cx="212" cy="117" r="212" fill="#f3d9a4" opacity="0.54"/>
      <circle cx="1043" cy="123" r="334" fill="#c2582c" opacity="0.48"/>
      <circle cx="1195" cy="1145" r="194" fill="#8c3a1d" opacity="0.7"/>
      <circle cx="375" cy="251" r="320" fill="#c2582c" opacity="0.72"/>
      <circle cx="633" cy="109" r="354" fill="#e8a24c" opacity="0.51"/>
      <circle cx="764" cy="27" r="221" fill="#e8a24c" opacity="0.48"/>
      <circle cx="682" cy="1034" r="125" fill="#f3d9a4" opacity="0.54"/>
      <circle cx="345" cy="1180" r="320" fill="#e8a24c" opacity="0.45"/>
      <circle cx="382" cy="269" r="310" fill="#c2582c" opacity="0.77"/>
  </g>
  <rect width="1200" height="1200" fill="url(#vig)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.55"/>

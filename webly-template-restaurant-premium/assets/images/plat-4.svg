<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <radialGradient id="bg" cx="34%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#3a2a16"/>
      <stop offset="62%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="78%">
      <stop offset="52%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="66"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.11"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <g filter="url(#soft)">
      <circle cx="457" cy="607" r="185" fill="#d98f3d" opacity="0.36"/>
      <circle cx="175" cy="538" r="327" fill="#d98f3d" opacity="0.33"/>
      <circle cx="1231" cy="965" r="85" fill="#b4682b" opacity="0.27"/>
      <circle cx="958" cy="293" r="181" fill="#7a4420" opacity="0.35"/>
      <circle cx="598" cy="180" r="128" fill="#b4682b" opacity="0.54"/>
      <circle cx="359" cy="402" r="182" fill="#f0b757" opacity="0.29"/>
      <circle cx="349" cy="1087" r="308" fill="#f0b757" opacity="0.3"/>
      <circle cx="374" cy="613" r="128" fill="#f0b757" opacity="0.57"/>
      <circle cx="102" cy="1041" r="138" fill="#b4682b" opacity="0.49"/>
      <circle cx="1070" cy="188" r="263" fill="#f0b757" opacity="0.71"/>
  </g>
  <rect width="1200" height="1200" fill="url(#vig)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.55"/>
</svg>

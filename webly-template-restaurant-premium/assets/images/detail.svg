      <circle cx="1442" cy="529" r="257" fill="#f0b757" opacity="0.61"/>
      <circle cx="541" cy="175" r="102" fill="#b4682b" opacity="0.38"/>
      <circle cx="407" cy="819" r="291" fill="#d98f3d" opacity="0.59"/>

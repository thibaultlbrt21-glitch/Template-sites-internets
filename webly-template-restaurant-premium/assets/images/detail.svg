<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050" preserveAspectRatio="xMidYMid slice" role="img">
  <defs>
    <radialGradient id="bg" cx="34%" cy="30%" r="82%">
      <stop offset="0%" stop-color="#3b2a15"/>
      <stop offset="62%" stop-color="#191310"/>
      <stop offset="100%" stop-color="#090809"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="78%">
      <stop offset="52%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">

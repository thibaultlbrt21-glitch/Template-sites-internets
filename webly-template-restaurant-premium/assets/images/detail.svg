      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.11"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1400" height="1050" fill="url(#bg)"/>
  <g filter="url(#soft)">
      <circle cx="630" cy="490" r="294" fill="#f0b757" opacity="0.72"/>
      <circle cx="772" cy="983" r="254" fill="#7a4420" opacity="0.73"/>

      <stop offset="0%" stop-color="#341a1c"/>
      <stop offset="62%" stop-color="#1a1012"/>
      <stop offset="100%" stop-color="#090809"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="78%">

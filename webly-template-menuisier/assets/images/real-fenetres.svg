<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img" aria-label="Fenêtres bois-aluminium posées en rénovation">
<defs>
  <filter id="v" x="-10%" y="-10%" width="120%" height="120%">

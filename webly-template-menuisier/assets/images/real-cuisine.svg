<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img" aria-label="Cuisine sur mesure">
<defs>
  <filter id="v" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.6" numOctaves="4" seed="89" result="f"/>
    <feColorMatrix in="f" type="matrix" result="fg"
      values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0.9 0 0 0 0"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.01" numOctaves="3" seed="129" result="o"/>
    <feDisplacementMap in="fg" in2="o" scale="30" xChannelSelector="R" yChannelSelector="G" result="fd"/>
    <feComposite in="fd" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="g">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="96"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
  </filter>
  <filter id="flou"><feGaussianBlur stdDeviation="22"/></filter>
  <linearGradient id="fond" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0%" stop-color="#dcb681"/><stop offset="50%" stop-color="#b98a52"/>
    <stop offset="100%" stop-color="#6b4a20"/>
  </linearGradient>
  <linearGradient id="rasant" x1="0" y1="0" x2="1" y2="0.7">
    <stop offset="0%" stop-color="#fff5e4" stop-opacity="0.30"/>
    <stop offset="38%" stop-color="#fff5e4" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#0d0f10" stop-opacity="0.52"/>
  </linearGradient>
</defs>
<rect width="900" height="1125" fill="url(#fond)"/>
<rect width="900" height="1125" fill="#6b4a20" opacity="0.5" filter="url(#v)"/><rect x="0" y="450" width="900" height="62" fill="#dcb681" opacity="0.4"/><rect x="0" y="512" width="900" height="34" fill="#000" opacity="0.34"/><rect x="0" y="546" width="900" height="585" fill="#6b4a20" opacity="0.30"/><line x1="216" y1="546" x2="216" y2="1125" stroke="#000" stroke-opacity="0.32" stroke-width="2"/><line x1="432" y1="546" x2="432" y2="1125" stroke="#000" stroke-opacity="0.32" stroke-width="2"/><line x1="648" y1="546" x2="648" y2="1125" stroke="#000" stroke-opacity="0.32" stroke-width="2"/><rect x="0" y="585" width="900" height="4" fill="#dcb681" opacity="0.34"/><line x1="0" y1="450" x2="900" y2="450" stroke="#7fb3d1" stroke-opacity="0.22" fill="none" stroke-width="1"/><rect width="900" height="1125" fill="url(#rasant)"/><rect width="900" height="1125" filter="url(#g)" opacity="0.55"/></svg>
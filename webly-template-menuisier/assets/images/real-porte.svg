<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="img" aria-label="Menuiserie extérieure">
<defs>
  <filter id="v" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.6" numOctaves="4" seed="113" result="f"/>
    <feColorMatrix in="f" type="matrix" result="fg"
      values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0.9 0 0 0 0"/>

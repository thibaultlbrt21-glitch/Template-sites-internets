<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Chêne massif — échantillon">
<defs>
  <filter id="veine1" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.62"
                  numOctaves="4" seed="11" result="fibre"/>
    <feColorMatrix in="fibre" type="matrix" result="fibreG"
      values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0.9 0 0 0 0"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.01"
                  numOctaves="3" seed="51" result="onde"/>
    <feDisplacementMap in="fibreG" in2="onde" scale="26"
                       xChannelSelector="R" yChannelSelector="G" result="fibreD"/>
    <feComposite in="fibreD" in2="SourceGraphic" operator="in" result="veinage"/>
  </filter>
  <linearGradient id="fond1" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0%" stop-color="#dcb681"/>
    <stop offset="52%" stop-color="#b98a52"/>
    <stop offset="100%" stop-color="#7c5628"/>
  </linearGradient>
  <filter id="grain1">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="1"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
  </filter>
  <radialGradient id="lum" cx="0.34" cy="0.24" r="0.92">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"/>
    <stop offset="55%" stop-color="#ffffff" stop-opacity="0.04"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.34"/>
  </radialGradient>
</defs>
<rect width="600" height="600" fill="url(#fond1)"/>
<rect width="600" height="600" fill="#7c5628" opacity="0.55" filter="url(#veine1)"/>
<rect width="600" height="600" fill="url(#lum)"/>
<rect width="600" height="600" filter="url(#grain1)" opacity="0.5"/>
</svg>